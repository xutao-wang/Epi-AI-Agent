AWSTemplateFormatVersion: '2010-09-09'
Description: One-time IAM bootstrap for Epi Agent Phase 2A CloudFormation stacks.

Parameters:
  DeveloperGroupName:
    Type: String
    Default: Developer

Resources:
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EpiAgentCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: epi-agent
        - Key: Environment
          Value: phase2a

  DeveloperPassExecutionRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EpiAgentDeveloperPassExecutionRole
      Groups:
        - !Ref DeveloperGroupName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt CloudFormationExecutionRole.Arn

  EpiAgentWorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      Project: epi-agent
      Environment: phase2a
    Properties:
      ManagedPolicyName: epi-agent-workload-boundary
      Description: Maximum permissions for Epi Agent Phase 2A workload roles.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadEpiAgentData
            Effect: Allow
            Action:
              - s3:GetBucketLocation
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::epi-agent-*
              - !Sub arn:${AWS::Partition}:s3:::epi-agent-*/*
          - Sid: WriteWorkloadLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:DescribeLogStreams
              - logs:PutLogEvents
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/epi-agent/*:*
          - Sid: ReadWorkloadParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/epi-agent/*
          - Sid: DescribeWorkloadNetworking
            Effect: Allow
            Action:
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: '*'

  CloudFormationExecutionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EpiAgentCloudFormationExecution
      Roles:
        - !Ref CloudFormationExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageNetworkAndCompute
            Effect: Allow
            Action:
              - ec2:AllocateAddress
              - ec2:AssociateAddress
              - ec2:AttachInternetGateway
              - ec2:AttachVolume
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateInternetGateway
              - ec2:CreateNatGateway
              - ec2:CreateNetworkInterface
              - ec2:CreateRoute
              - ec2:CreateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:CreateSubnet
              - ec2:CreateTags
              - ec2:CreateVolume
              - ec2:CreateVpc
              - ec2:DeleteInternetGateway
              - ec2:DeleteNatGateway
              - ec2:DeleteNetworkInterface
              - ec2:DeleteRoute
              - ec2:DeleteRouteTable
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteTags
              - ec2:DeleteVolume
              - ec2:DeleteVpc
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInstances
              - ec2:DescribeInternetGateways
              - ec2:DescribeNatGateways
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVolumes
              - ec2:DescribeVpcs
              - ec2:DetachInternetGateway
              - ec2:DetachVolume
              - ec2:DisassociateAddress
              - ec2:ModifyNetworkInterfaceAttribute
              - ec2:ModifySubnetAttribute
              - ec2:ModifyVpcAttribute
              - ec2:ReleaseAddress
              - ec2:RevokeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RunInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - ec2:TerminateInstances
            Resource: '*'
          - Sid: ManageEpiAgentStorage
            Effect: Allow
            Action:
              - s3:AbortMultipartUpload
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:DeleteObject
              - s3:GetBucketLocation
              - s3:GetBucketPolicy
              - s3:GetEncryptionConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetObject
              - s3:ListBucket
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
              - s3:PutBucketPolicy
              - s3:PutObject
              - s3:PutObjectTagging
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::epi-agent-*
              - !Sub arn:${AWS::Partition}:s3:::epi-agent-*/*
          - Sid: ManageCognito
            Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:DeleteUserPool
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:DescribeUserPool
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:ListUserPools
              - cognito-idp:UpdateUserPool
              - cognito-idp:UpdateUserPoolClient
            Resource: '*'
          - Sid: ManageDnsRecords
            Effect: Allow
            Action:
              - route53:ChangeResourceRecordSets
              - route53:ListResourceRecordSets
            Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/*
          - Sid: ReadDnsChanges
            Effect: Allow
            Action: route53:GetChange
            Resource: !Sub arn:${AWS::Partition}:route53:::change/*
          - Sid: ManageObservability
            Effect: Allow
            Action:
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:PutMetricAlarm
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DescribeLogGroups
              - logs:PutRetentionPolicy
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:ListTopics
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
            Resource: '*'
          - Sid: ManageParametersAndLifecyclePolicies
            Effect: Allow
            Action:
              - ssm:AddTagsToResource
              - ssm:DeleteParameter
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:ListTagsForResource
              - ssm:PutParameter
              - dlm:CreateLifecyclePolicy
              - dlm:DeleteLifecyclePolicy
              - dlm:GetLifecyclePolicies
              - dlm:GetLifecyclePolicy
              - dlm:TagResource
              - dlm:UpdateLifecyclePolicy
            Resource: '*'
          - Sid: ManageEpiAgentRoleReadAndDeletion
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/epi-agent-*
          - Sid: CreateEpiAgentRoleWithBoundary
            Effect: Allow
            Action: iam:CreateRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/epi-agent-*
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !GetAtt EpiAgentWorkloadBoundary.PolicyArn
          - Sid: MutateEpiAgentRolePermissionsAndTrustWithBoundary
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/epi-agent-*
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !GetAtt EpiAgentWorkloadBoundary.PolicyArn
          - Sid: PassEpiAgentRolesToApprovedServices
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/epi-agent-*
            Condition:
              StringEquals:
                iam:PassedToService:
                  - ec2.amazonaws.com
                  - dlm.amazonaws.com

Outputs:
  CloudFormationExecutionRoleArn:
    Description: ARN of the role CloudFormation assumes for Phase 2A stacks.
    Value: !GetAtt CloudFormationExecutionRole.Arn
